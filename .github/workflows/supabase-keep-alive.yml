name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC (well within Supabase's 1-week inactivity window)
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "⏰ $(date -u) — Pinging Supabase project..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            "${SUPABASE_URL}/rest/v1/config?select=key,value&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "📡 HTTP Status: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ Supabase is alive and responding."
          else
            echo "❌ Unexpected response: $RESPONSE"
            exit 1
          fi
